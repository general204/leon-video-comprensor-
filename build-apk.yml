name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependencias
        run: npm install
      - name: Preparar web
        run: |
          mkdir -p www/vendor
          cp index.html www/index.html
          cp node_modules/react/umd/react.production.min.js www/vendor/
          cp node_modules/react-dom/umd/react-dom.production.min.js www/vendor/
          cp node_modules/htm/dist/htm.umd.js www/vendor/
      - name: Crear proyecto Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LeonEdits-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
